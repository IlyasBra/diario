<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Diario: organiza tus tareas del día y tus recordatorios." />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Applies the saved theme before the first paint, so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem('diario:theme') || '"system"')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0f172a' : '#f8fafc')
      } catch (error) {}
      // Same for the language: set it (and the direction) before the app loads.
      try {
        var supported = ['es', 'en', 'fr', 'ar', 'it', 'de']
        var choice = JSON.parse(localStorage.getItem('diario:language') || '"auto"')
        var language = supported.indexOf(choice) >= 0 ? choice : null
        var preferred = navigator.languages || [navigator.language]
        for (var i = 0; !language && i < preferred.length; i++) {
          var base = String(preferred[i]).toLowerCase().split('-')[0]
          if (supported.indexOf(base) >= 0) language = base
        }
        language = language || 'en'
        document.documentElement.lang = language
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Diario" />
    <title>Diario</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
